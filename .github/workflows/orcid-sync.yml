name: Sync ORCID Publications

on:
  schedule:
    - cron: '0 3 * * 0' # Every Sunday at 3:00 AM UTC
  workflow_dispatch: # Allows manual triggering from the GitHub Actions tab

permissions:
  contents: write

jobs:
  sync-orcid:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run ORCID Update Script
        run: python scripts/update_orcid.py
        env:
          ORCID_ID: "0000-0002-1474-8066"

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/publications.json
          
          # Check if there are changes staged
          if git diff --staged --quiet; then
            echo "No updates to publications.json detected."
          else
            echo "Updates detected. Committing and pushing changes..."
            git commit -m "chore: auto-sync publications from ORCID [skip ci]"
            git push
          fi
